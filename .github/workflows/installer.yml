name: windows installer

# Builds dupefinder-setup-<version>.exe on a Windows machine, checks that the
# built app and the installed app both pass the smoke test, and that uninstall
# works. The installer is kept as a download on each run; a tag like v0.2.0
# also publishes it as a GitHub release.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write          # only used to publish a release for a v* tag

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build tools
        run: python -m pip install -r requirements-app.txt pyinstaller

      - name: Version
        id: version
        shell: pwsh
        run: |
          $v = python -c "import dupefinder; print(dupefinder.__version__)"
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build the app folder (PyInstaller)
        run: >
          pyinstaller --noconfirm --windowed --name dupefinder --paths .
          --icon packaging\dupefinder.ico
          --add-data "dupefinder\app\icon.png;dupefinder\app"
          packaging\launch.py

      - name: Smoke test the built app
        shell: pwsh
        run: |
          $p = Start-Process dist\dupefinder\dupefinder.exe -ArgumentList '--smoke-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "smoke test failed: exit code $($p.ExitCode)" }

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build the installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.version.outputs.version }}" packaging\dupefinder.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - name: Install, smoke test and uninstall
        shell: pwsh
        run: |
          $setup = "dist-installer\dupefinder-setup-${{ steps.version.outputs.version }}.exe"
          Start-Process $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          $exe = "$env:LOCALAPPDATA\Programs\dupefinder\dupefinder.exe"
          if (-not (Test-Path $exe)) { throw "not installed at $exe" }
          $p = Start-Process $exe -ArgumentList '--smoke-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installed app failed the smoke test" }
          Start-Process "$env:LOCALAPPDATA\Programs\dupefinder\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES' -Wait
          Start-Sleep -Seconds 3
          if (Test-Path $exe) { throw "uninstall left the program behind" }

      - uses: actions/upload-artifact@v4
        with:
          name: dupefinder-setup-${{ steps.version.outputs.version }}
          path: dist-installer\*.exe

      - name: Publish a release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist-installer\*.exe --title "dupefinder ${{ github.ref_name }}" --generate-notes
